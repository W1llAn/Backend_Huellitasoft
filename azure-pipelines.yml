trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  AZURE_SERVICE_CONNECTION: 'sc-huellitasoft'    # <-- tu Service Connection (ARM)
  WEBAPP_NAME: 'huellitasoft-backend-dev'        # <-- nombre del App Service
  ARTIFACT_NAME: 'drop'
  JAVA_VERSION: '21'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: build
        steps:
          - task: UseJavaVersion@1
            displayName: 'Set up Java $(JAVA_VERSION)'
            inputs:
              versionSpec: '$(JAVA_VERSION)'
              distribution: 'microsoft'          # o 'temurin'
              architecture: 'x64'

          - task: Cache@2
            displayName: 'Cache Maven (~/.m2)'
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: ~/.m2/repository

          - task: Maven@3
            displayName: 'Maven clean verify (con cobertura)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '-B'                      # modo batch
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              codeCoverageToolOption: 'JaCoCo'
              javaHomeOption: 'Path'
              jdkDirectory: '$(JAVA_HOME)'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura JaCoCo'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '**/target/site/jacoco/jacoco.xml'
              reportDirectory: '**/target/site/jacoco'
              failIfCoverageEmpty: false

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto (.jar)'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/**/target/*.jar'
              artifact: '$(ARTIFACT_NAME)'

  - stage: Deploy
    displayName: Deploy to Web App (Java 21)
    dependsOn: Build
    condition: |
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/develop')
      )
    jobs:
      - job: deploy
        steps:
          - download: current
            artifact: '$(ARTIFACT_NAME)'

          - task: AzureWebApp@1
            displayName: 'Desplegar .jar a Azure Web App'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appName: '$(WEBAPP_NAME)'
              appType: 'webAppLinux'
              runtimeStack: 'JAVA|21-java21'      # Java 21 en Linux
              package: '$(Pipeline.Workspace)/$(ARTIFACT_NAME)/*.jar'
